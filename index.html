<style>
:root{--navy:#17365d;--orange:#ed7d31;--bg:#f4f7fb;--line:#dce4ee;--text:#172033;--muted:#64748b}
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--text)}header{background:var(--navy);color:#fff;padding:22px 0}.wrap{max-width:1180px;margin:auto;padding:0 18px}.brand{font-size:24px;font-weight:800}.privacy{float:right;font-size:12px;opacity:.85}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;box-shadow:0 8px 24px #17365d12;margin-top:24px}.drop{border:2px dashed #aab8c8;border-radius:12px;padding:38px 20px;text-align:center;cursor:pointer}.drop.drag,.drop:hover{border-color:var(--orange);background:#fff9f5}.hint,.files,.footer{color:var(--muted);font-size:13px}.actions{display:flex;gap:10px;justify-content:flex-end;margin:18px 0}.btn{border:0;border-radius:9px;padding:11px 16px;font-weight:700;cursor:pointer}.btn:disabled{opacity:.45}.orange{background:var(--orange);color:#fff}.navy{background:var(--navy);color:#fff}.gray{background:#e8edf3;color:var(--navy)}.status{padding:12px 14px;border-radius:9px;background:#e8f6ed;margin-bottom:16px;display:none}.status.bad{background:#fdecec;color:#991b1b}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:15px}.kpi b{font-size:24px;color:var(--navy)}.tabs{display:flex;gap:6px;margin:14px 0;flex-wrap:wrap}.tab{padding:8px 12px;border:1px solid #ccd5df;background:#fff;border-radius:8px;cursor:pointer}.tab.on{background:var(--navy);color:#fff}.table{max-height:560px;overflow:auto;border-radius:12px;border:1px solid var(--line)}table{width:100%;border-collapse:collapse;background:#fff;font-size:12px}th{background:var(--navy);color:#fff;padding:9px;text-align:left;position:sticky;top:0}td{padding:8px;border-bottom:1px solid #edf1f5}.num{text-align:right;font-variant-numeric:tabular-nums}.warn{background:#fff8e8}.footer{padding:18px 0 30px}@media(max-width:800px){.kpis{grid-template-columns:1fr 1fr}.privacy{float:none;display:block;margin-top:8px}}
</style>
</head>
<body>
<header><div class="wrap"><span class="brand">e-Think｜銀行電子函證 PDF 清洗工具</span><span class="privacy">🔒 PDF 僅在瀏覽器本機解析</span></div></header>
<main class="wrap">
<div class="card">
<h3>上傳銀行電子函證 PDF</h3>
<div id="drop" class="drop"><strong>拖曳 PDF 到這裡，或點擊選擇檔案</strong><div class="hint">可一次上傳多份金融區塊鏈電子函證 PDF</div><input id="pdfs" type="file" accept="application/pdf,.pdf" multiple hidden></div>
<div id="fileList" class="files" style="margin-top:12px"></div>
</div>
<div class="actions"><button class="btn gray" id="clearBtn">清除全部</button><button class="btn orange" id="runBtn">開始清洗</button><button class="btn navy" id="dlBtn" disabled>下載 Excel</button></div>
<div id="status" class="status"></div>
<section id="result" style="display:none">
<div class="kpis"><div class="kpi">PDF 檔案<br><b id="k1">0</b></div><div class="kpi">存款筆數<br><b id="k2">0</b></div><div class="kpi">借款筆數<br><b id="k3">0</b></div><div class="kpi">需複核<br><b id="k4">0</b></div></div>
<div class="tabs"><button class="tab on" data-tab="s1">1. 存款</button><button class="tab" data-tab="s2">2. 貼現及放款</button><button class="tab" data-tab="s3">3. 應收帳款承購</button><button class="tab" data-tab="s4">4. 已開立信用狀</button><button class="tab" data-tab="s5">5. 承兌</button><button class="tab" data-tab="s6">6. 保證</button><button class="tab" data-tab="s7">7. 衍生工具</button><button class="tab" data-tab="s8">8. 黃金存摺</button><button class="tab" data-tab="s9">9. 註銷帳戶</button><button class="tab" data-tab="s10">10. 其他項目</button><button class="tab" data-tab="meta">函證資訊</button><button class="tab" data-tab="diag">解析診斷</button></div>
<div class="table"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div>
</section>
<div class="footer">本工具只讀取與彙整 PDF，不會修改任何 A／AA 底稿。</div>
</main>
<script>
(function(){
'use strict';
if(!window.pdfjsLib){alert('PDF 解析元件載入失敗，請重新整理頁面。');return;}
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
const S={files:[],s1:[],s2:[],s3:[],s4:[],s5:[],s6:[],s7:[],s8:[],s9:[],s10:[],meta:[],diag:[],tab:'s1'};
const $=id=>document.getElementById(id);
const n=v=>String(v??'').replace(/\u00a0/g,' ').replace(/[ \t]+/g,' ').trim();
const money=v=>{if(v===null||v===undefined||v==='')return null;const x=Number(String(v).replace(/,/g,'').replace(/[^0-9.-]/g,''));return Number.isFinite(x)?x:null;};
const ccy=v=>{v=n(v).toUpperCase();return v==='NTD'||v==='NT$'?'TWD':v;};
const acct=v=>String(v??'').replace(/\D/g,'');
const dedupe=(arr,keyfn)=>[...new Map(arr.map(x=>[keyfn(x),x])).values()];
function show(msg,bad=false){$('status').textContent=msg;$('status').className='status'+(bad?' bad':'');$('status').style.display='block';}
function setFiles(fs){S.files=fs.filter(f=>f.name.toLowerCase().endsWith('.pdf'));$('fileList').innerHTML=S.files.length?S.files.map(f=>'📄 '+f.name).join('<br>'):'尚未選擇檔案';}
const drop=$('drop'),pdfs=$('pdfs');drop.addEventListener('click',()=>pdfs.click());pdfs.addEventListener('change',e=>setFiles([...e.target.files]));['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('drag');}));['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('drag');}));drop.addEventListener('drop',e=>setFiles([...e.dataTransfer.files]));
async function readPdf(file){
  const data=await file.arrayBuffer();
  const doc=await pdfjsLib.getDocument({data}).promise;
  let natural=[], visual=[];
  for(let p=1;p<=doc.numPages;p++){
    const page=await doc.getPage(p); const tc=await page.getTextContent();
    const raw=tc.items.map(it=>n(it.str)).filter(Boolean);
    natural.push(raw.join(' '));
    const items=tc.items.map(it=>({s:n(it.str),x:it.transform[4],y:it.transform[5]})).filter(it=>it.s);
    items.sort((a,b)=>Math.abs(b.y-a.y)>2?b.y-a.y:a.x-b.x);
    const lines=[];
    for(const it of items){let line=lines.find(l=>Math.abs(l.y-it.y)<2);if(!line){line={y:it.y,a:[]};lines.push(line)}line.a.push(it)}
    lines.sort((a,b)=>b.y-a.y);
    visual.push(...lines.map(l=>l.a.sort((a,b)=>a.x-b.x).map(x=>x.s).join(' ')));
  }
  return {pages:doc.numPages,lines:visual,text:natural.join('\n'),naturalText:natural.join(' ')};
}
function detectBank(text){const t=n(text);const aliases=[['華南','華南商業銀行'],['新光','臺灣新光商業銀行'],['彰化商業銀行','彰化商業銀行'],['彰銀','彰化商業銀行'],['臺灣土地銀行','臺灣土地銀行'],['土地銀行','臺灣土地銀行'],['土銀','臺灣土地銀行'],['中國信託','中國信託商業銀行'],['中信','中國信託商業銀行'],['元大','元大商業銀行'],['台中銀行','台中銀行'],['台中銀','台中銀行'],['兆豐','兆豐國際商業銀行'],['台北富邦','台北富邦商業銀行'],['北富銀','台北富邦商業銀行'],['臺灣中小企業','臺灣中小企業銀行'],['台灣中小企業','臺灣中小企業銀行'],['臺企','臺灣中小企業銀行'],['台企','臺灣中小企業銀行']];for(const [k,v] of aliases)if(t.includes(k))return v;return '';}
function compactText(text){
  return n(text).replace(/\s+/g,' ')
  .replace(/1\s*[.．、:]\s*存款\s*[:：]?/g,'1.存款 ')
  .replace(/2\s*[.．、:]\s*貼現及放款(?:（不含應收帳款承購）)?\s*[:：]?/g,'2.貼現及放款 ')
  .replace(/3\s*[.．、:]\s*應收帳款承購\s*[:：]?/g,'3.應收帳款承購 ')
  .replace(/4\s*[.．、:]\s*已開立信用狀(?:（未使用餘額）)?\s*[:：]?/g,'4.已開立信用狀 ')
  .replace(/5\s*[.．、:]\s*承兌\s*[:：]?/g,'5.承兌 ')
  .replace(/6\s*[.．、:]\s*保證\s*[:：]?/g,'6.保證 ')
  .replace(/7\s*[.．、:]\s*衍生工具\s*[:：]?/g,'7.衍生工具 ')
  .replace(/8\s*[.．、:]\s*黃金存摺\s*[:：]?/g,'8.黃金存摺 ')
  .replace(/9\s*[.．、:]\s*過去\s*12\s*個月內[^:：]*[:：]?/g,'9.過去12個月內註銷帳戶資訊 ')
  .replace(/10\s*[.．、:]\s*其他項目\s*[:：]?/g,'10.其他項目 ')
  .replace(/活期\s*存款/g,'活期存款').replace(/支票\s*存款/g,'支票存款').replace(/定期\s*存款/g,'定期存款')
  .replace(/短期\s*放\s*款/g,'短期放款').replace(/中長期\s*放\s*款/g,'中長期放款').replace(/中期\s*擔\s*保\s*放\s*款/g,'中期擔保放款')
  .replace(/墊付國\s*內票款/g,'墊付國內票款').replace(/分支機構名\s*稱/g,'分支機構名稱').replace(/金融機構名\s*稱/g,'金融機構名稱').replace(/查核基準\s*日/g,'查核基準日');
}
function parseMeta(text,file){const t=compactText(text);const company=(t.match(/查核企業名稱\s*([^\s]+(?:股份有限公司|有限公司|公司))/)||[])[1]||'';const id=(t.match(/查核企業統編\s*(\d{8})/)||[])[1]||'';const date=(t.match(/查核基準日\s*(\d{4}\/\d{2}\/\d{2})/)||[])[1]||'';const caseNo=(t.match(/(?:案件申請編號|詢證函案件編號)\s*([0-9-]+)/)||[])[1]||'';let bank=detectBank(t);if(!bank){const m=t.match(/金融機構名稱\s*([^\s]+(?:銀行|銀行股份有限公司|商業銀行|商業銀行股份有限公司))/);bank=m?m[1]:'';}let branch='';const bm=t.match(/分支機構名稱\s*([^\s]+(?:總行|分行|彰化|鹿港|福興)?)/);if(bm)branch=bm[1];if(!branch){branch=file.replace(/\.pdf$/i,'').split('-').slice(1).join('-');}return{file,company,id,date,bank,branch,caseNo};}
function sectionText(text,start,end){const t=compactText(text);const s=t.indexOf(start);if(s<0)return'';const e=end?t.indexOf(end,s+start.length):-1;return t.slice(s,e>s?e:t.length);}
function parseDeposits(text,meta){const sec=sectionText(text,'1.存款','2.貼現及放款');const out=[];const re=/(活期存款|支票存款|定期存款|外幣存款)\s*(\d{6,20})\s*(TWD|NTD|USD|EUR|JPY|CNY|RMB|HKD|GBP|AUD|CAD|SGD)\s*(-?[0-9][0-9,]*(?:\.\d+)?)/gi;let m;while((m=re.exec(sec))){const tail=sec.slice(re.lastIndex,Math.min(sec.length,re.lastIndex+120));const nums=(tail.match(/\b\d+\.\d{3,6}\b/g)||[]).map(Number);let rate=nums.length?nums[nums.length-1]:null;out.push({bank:meta.bank,branch:meta.branch,type:m[1],account:acct(m[2]),currency:ccy(m[3]),balance:money(m[4]),rate,baseDate:meta.date,file:meta.file});}return dedupe(out,x=>[x.file,x.account,x.currency,x.type,x.balance].join('|'));}
function parseLoans(text,meta){const sec=sectionText(text,'2.貼現及放款','3.應收帳款承購');const out=[];const re=/(中期擔保放款|中長期放款|短期放款|透支|貼現|墊付國內票款)\s*(\d{8,22})\s*(TWD|NTD|USD|EUR|JPY|CNY|RMB|HKD|GBP|AUD|CAD|SGD)\s*(-?[0-9][0-9,]*(?:\.\d+)?)/gi;let m;while((m=re.exec(sec))){const rest=sec.slice(re.lastIndex);const next=rest.search(/(?:中期擔保放款|中長期放款|短期放款|透支|貼現|墊付國內票款)/);const tail=rest.slice(0,next>=0?next:Math.min(rest.length,320));const dates=tail.match(/\d{4}\/\d{2}\/\d{2}/g)||[];let rate=null;if(dates.length>=2){const pos=tail.indexOf(dates[1])+dates[1].length;const rm=tail.slice(pos).match(/\b\d{1,3}\.\d{2,6}\b/);rate=rm?Number(rm[0]):null;}else{const rm=tail.match(/\b\d{1,3}\.\d{2,6}\b/);rate=rm?Number(rm[0]):null;}const collateral=/土地|建物/.test(tail)?'土地建物':(/\s有\s+有\s/.test(' '+tail+' ')?'有':'');out.push({bank:meta.bank,branch:meta.branch,type:m[1],account:acct(m[2]),currency:ccy(m[3]),balance:money(m[4]),loanDate:dates[0]||'',maturity:dates[1]||'',rate,collateral,baseDate:meta.date,file:meta.file});}return dedupe(out,x=>[x.file,x.account,x.currency,x.type,x.balance].join('|'));}
function getSectionLines(lines,no,nextNo){
  const norm=x=>compactText(x);
  let s=lines.findIndex(x=>norm(x).includes(no+'.'));
  if(s<0)s=lines.findIndex(x=>norm(x).startsWith(String(no)));
  if(s<0)return[];
  let e=lines.length;
  if(nextNo){const z=lines.findIndex((x,i)=>i>s&&(norm(x).includes(nextNo+'.')||norm(x).startsWith(String(nextNo)+'.')));if(z>s)e=z;}
  return lines.slice(s+1,e).map(n).filter(Boolean);
}
function metaRow(meta){return{bank:meta.bank,branch:meta.branch,file:meta.file};}
function parseS3(lines,meta){const sec=getSectionLines(lines,3,4),out=[];for(const line of sec){if(/^(本行有無追|索權|幣|別|尚未|原始|已付|有無簽發|本票|預支價金|其他必要)/.test(line))continue;if(/無\s+無/.test(line)){out.push({...metaRow(meta),recourse:'無',currency:'',uncollected:null,originalTransfer:null,advancePaid:null,companyAR:null,promissoryNote:'無',promissoryAmount:null,interestCharged:'無',note:'無'});break;}}return out;}
function parseS4(lines,meta){const out=[];for(const line of getSectionLines(lines,4,5)){let m=line.match(/^(即期信用狀|遠期信用狀)\s+(.*)$/);if(!m)continue;const t=m[2].split(/\s+/);if(t[0]==='無'){out.push({...metaRow(meta),type:m[1],lcNo:'無',currency:'',unusedBalance:null,marginBalance:null,guarantor:'無',collateral:'無',note:'無'});continue;}out.push({...metaRow(meta),type:m[1],lcNo:t[0]||'',currency:ccy(t[1]),unusedBalance:money(t[2]),marginBalance:money(t[3]),guarantor:t[4]||'',collateral:t[5]||'',note:t.slice(6).join(' ')});}return out;}
function parseSimpleBalance(lines,meta,no,nextNo){const out=[];for(const line of getSectionLines(lines,no,nextNo)){if(/^項目\s+幣別\s+餘額/.test(line))continue;const m=line.match(/^(.+?)\s+(TWD|NTD|USD|EUR|JPY|CNY|RMB|HKD|GBP|AUD|CAD|SGD|無)\s+(-?[0-9][0-9,]*(?:\.\d+)?|無)(?:\s+(\d{4}\/\d{2}\/\d{2}|無))?(?:\s+(.*))?$/i);if(!m)continue;out.push({...metaRow(meta),item:m[1],currency:m[2]==='無'?'':ccy(m[2]),balance:m[3]==='無'?null:money(m[3]),maturity:m[4]&&m[4]!=='無'?m[4]:'',note:m[5]||''});}return out;}
function parseS7(lines,meta){const out=[];for(const line of getSectionLines(lines,7,8)){if(/^項目\s+合約號碼/.test(line))continue;const names=['遠期外匯合約','選擇權','優利投資','換匯換利','換利交易','換匯交易','其他'];let name=names.find(x=>line.startsWith(x));if(!name)continue;let rest=line.slice(name.length).trim(),t=rest.split(/\s+/);if(!t.length)continue;if(t[0]==='無'){out.push({...metaRow(meta),item:name,contractNo:'無',tradeDate:'',maturity:'',currency1:'',currency2:'',notional:null,fairValue:null,margin:'無',marginAmount:null,collateral:'無',note:'無'});continue;}out.push({...metaRow(meta),item:name,contractNo:t[0]||'',tradeDate:t[1]||'',maturity:t[2]||'',currency1:ccy(t[3]||''),currency2:ccy(t[4]||''),notional:money(t[5]),fairValue:money(t[6]),margin:t[7]||'',marginAmount:money(t[8]),collateral:t[9]||'',note:t.slice(10).join(' ')});}return out;}
function parseS8(lines,meta){const out=[];for(const line of getSectionLines(lines,8,9)){if(/^項目\s+帳號/.test(line))continue;const m=line.match(/^(黃金存摺)\s+(.*)$/);if(!m)continue;const t=m[2].split(/\s+/);if(t[0]==='無'){out.push({...metaRow(meta),item:m[1],account:'無',currency:'',balance:null,unit:'',restricted:'無',restrictionNote:'',note:'無'});continue;}out.push({...metaRow(meta),item:m[1],account:acct(t[0]),currency:ccy(t[1]),balance:money(t[2]),unit:t[3]||'',restricted:t[4]||'',restrictionNote:t[5]||'',note:t.slice(6).join(' ')});}return out;}
function parseS9(lines,meta){const out=[];for(const line of getSectionLines(lines,9,10)){if(/^帳戶名稱\s+帳號/.test(line))continue;if(/^無\s+無/.test(line)){out.push({...metaRow(meta),accountName:'無',account:'無',currency:'',closeDate:'',note:'無'});break;}const m=line.match(/^(.+?)\s+(\d{6,20})\s+(TWD|NTD|USD|EUR|JPY|CNY|RMB|HKD|GBP|AUD|CAD|SGD)\s+(\d{4}\/\d{2}\/\d{2})(?:\s+(.*))?$/i);if(m)out.push({...metaRow(meta),accountName:m[1],account:acct(m[2]),currency:ccy(m[3]),closeDate:m[4],note:m[5]||''});}return out;}
function parseS10(lines,meta){const out=[];const names=['代收票據','供副擔保而代保管之有價證券','供副擔保而代保管之票據','信託','其他'];for(const line of getSectionLines(lines,10,null)){if(/^項目\s+名稱\s+數量\s+金額/.test(line))continue;let name=names.find(x=>line.startsWith(x));if(!name)continue;const rest=line.slice(name.length).trim(),t=rest.split(/\s+/);if(!t.length||t[0]==='無'){out.push({...metaRow(meta),item:name,name:'無',quantity:null,amount:null,note:'無'});continue;}out.push({...metaRow(meta),item:name,name:t[0]||'',quantity:money(t[1]),amount:money(t[2]),note:t.slice(3).join(' ')});}return out;}
function toS1(dep){return dep.map(x=>({...x}))}
function toS2(loan){return loan.map(x=>({...x}))}
async function run(){
  if(!S.files.length){show('請先上傳 PDF',true);return;}
  $('runBtn').disabled=true;for(const k of ['s1','s2','s3','s4','s5','s6','s7','s8','s9','s10','meta','diag'])S[k]=[];show('解析中…');

  $('runBtn').disabled=false;$('dlBtn').disabled=false;$('result').style.display='block';$('k1').textContent=S.files.length;$('k2').textContent=S.s1.length;$('k3').textContent=S.s2.length;$('k4').textContent=S.diag.filter(x=>x.warning).length;show('完成：存款 '+S.s1.length+' 筆、借款 '+S.s2.length+' 筆；3–10 區已結構化');render();
}

};
const numericKeys=new Set(['balance','amount','unusedBalance','marginBalance','uncollected','originalTransfer','advancePaid','companyAR','promissoryAmount','notional','fairValue','marginAmount','quantity']);
function fmt(v,key){if(v===null||v===undefined||v==='')return'';if(numericKeys.has(key)&&typeof v==='number')return new Intl.NumberFormat('zh-TW',{maximumFractionDigits:6}).format(v);return String(v);}
function render(){const c=cols[S.tab],d=S[S.tab];$('thead').innerHTML='<tr>'+c.map(x=>'<th class="'+(numericKeys.has(x[0])?'num':'')+'">'+x[1]+'</th>').join('')+'</tr>';$('tbody').innerHTML=d.map(r=>'<tr class="'+(r.warning?'warn':'')+'">'+c.map(x=>'<td class="'+(numericKeys.has(x[0])?'num':'')+'">'+fmt(r[x[0]],x[0])+'</td>').join('')+'</tr>').join('')||'<tr><td colspan="15">目前沒有資料</td></tr>';}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));b.classList.add('on');S.tab=b.dataset.tab;render();}));
function download(){if(!window.XLSX){show('Excel 匯出元件載入失敗',true);return;}const w=XLSX.utils.book_new();const sheets=[['01_存款','s1'],['02_貼現及放款','s2'],['03_應收帳款承購','s3'],['04_已開立信用狀','s4'],['05_承兌','s5'],['06_保證','s6'],['07_衍生工具','s7'],['08_黃金存摺','s8'],['09_註銷帳戶','s9'],['10_其他項目','s10'],['函證資訊','meta'],['解析診斷','diag']];for(const [name,key] of sheets){const c=cols[key],d=S[key],ws=XLSX.utils.aoa_to_sheet([c.map(x=>x[1]),...d.map(r=>c.map(x=>r[x[0]]??''))]);for(let R=1;R<=d.length;R++)for(let C=0;C<c.length;C++){const k=c[C][0];if(numericKeys.has(k)){const addr=XLSX.utils.encode_cell({r:R,c:C});if(ws[addr]&&typeof ws[addr].v==='number')ws[addr].z='#,##0.00######';}}ws['!cols']=c.map(x=>({wch:Math.max(12,Math.min(28,x[1].length*2+6))}));XLSX.utils.book_append_sheet(w,ws,name);}XLSX.writeFile(w,'銀行電子函證_10大區塊清洗結果.xlsx');}
function clearAll(){S.files=[];for(const k of ['s1','s2','s3','s4','s5','s6','s7','s8','s9','s10','meta','diag'])S[k]=[];$('fileList').textContent='';$('result').style.display='none';$('status').style.display='none';$('dlBtn').disabled=true;pdfs.value='';}
$('runBtn').addEventListener('click',run);$('dlBtn').addEventListener('click',download);$('clearBtn').addEventListener('click',clearAll);
})();

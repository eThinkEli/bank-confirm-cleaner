<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>e-Think 銀行電子函證 PDF 清洗工具</title>
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{--navy:#17365d;--orange:#ed7d31;--bg:#f4f7fb;--line:#dce4ee;--text:#172033;--muted:#64748b}
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--text)}header{background:var(--navy);color:#fff;padding:22px 0}.wrap{max-width:1180px;margin:auto;padding:0 18px}.brand{font-size:24px;font-weight:800}.privacy{float:right;font-size:12px;opacity:.85}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;box-shadow:0 8px 24px #17365d12;margin-top:24px}.drop{border:2px dashed #aab8c8;border-radius:12px;padding:38px 20px;text-align:center;cursor:pointer}.drop.drag,.drop:hover{border-color:var(--orange);background:#fff9f5}.hint,.files,.footer{color:var(--muted);font-size:13px}.actions{display:flex;gap:10px;justify-content:flex-end;margin:18px 0}.btn{border:0;border-radius:9px;padding:11px 16px;font-weight:700;cursor:pointer}.btn:disabled{opacity:.45}.orange{background:var(--orange);color:#fff}.navy{background:var(--navy);color:#fff}.gray{background:#e8edf3;color:var(--navy)}.status{padding:12px 14px;border-radius:9px;background:#e8f6ed;margin-bottom:16px;display:none}.status.bad{background:#fdecec;color:#991b1b}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:15px}.kpi b{font-size:24px;color:var(--navy)}.tabs{display:flex;gap:6px;margin:14px 0;flex-wrap:wrap}.tab{padding:8px 12px;border:1px solid #ccd5df;background:#fff;border-radius:8px;cursor:pointer}.tab.on{background:var(--navy);color:#fff}.table{max-height:560px;overflow:auto;border-radius:12px;border:1px solid var(--line)}table{width:100%;border-collapse:collapse;background:#fff;font-size:12px}th{background:var(--navy);color:#fff;padding:9px;text-align:left;position:sticky;top:0}td{padding:8px;border-bottom:1px solid #edf1f5}.warn{background:#fff8e8}.footer{padding:18px 0 30px}@media(max-width:800px){.kpis{grid-template-columns:1fr 1fr}.privacy{float:none;display:block;margin-top:8px}}
</style>
</head>
<body>
<header><div class="wrap"><span class="brand">e-Think｜銀行電子函證 PDF 清洗工具</span><span class="privacy">🔒 PDF 僅在瀏覽器本機解析</span></div></header>
<main class="wrap">
<div class="card">
<h3>上傳銀行電子函證 PDF</h3>
<div id="drop" class="drop"><strong>拖曳 PDF 到這裡，或點擊選擇檔案</strong><div class="hint">可一次上傳多份金融區塊鏈電子函證 PDF</div><input id="pdfs" type="file" accept="application/pdf,.pdf" multiple hidden></div>
<div id="fileList" class="files" style="margin-top:12px"></div>
</div>
<div class="actions"><button class="btn gray" id="clearBtn">清除全部</button><button class="btn orange" id="runBtn">開始清洗</button><button class="btn navy" id="dlBtn" disabled>下載 Excel</button></div>
<div id="status" class="status"></div>
<section id="result" style="display:none">
<div class="kpis"><div class="kpi">PDF 檔案<br><b id="k1">0</b></div><div class="kpi">存款筆數<br><b id="k2">0</b></div><div class="kpi">借款筆數<br><b id="k3">0</b></div><div class="kpi">需複核<br><b id="k4">0</b></div></div>
<div class="tabs"><button class="tab on" data-tab="dep">銀行存款</button><button class="tab" data-tab="loan">銀行借款</button><button class="tab" data-tab="meta">函證資訊</button><button class="tab" data-tab="diag">解析診斷</button></div>
<div class="table"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div>
</section>
<div class="footer">本工具只讀取與彙整 PDF，不會修改任何 A／AA 底稿。</div>
</main>
<script>
(function(){
'use strict';
if(!window.pdfjsLib){alert('PDF 解析元件載入失敗，請重新整理頁面。');return;}
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
const S={files:[],dep:[],loan:[],meta:[],diag:[],tab:'dep'};
const $=id=>document.getElementById(id);
const n=v=>String(v??'').replace(/\u00a0/g,' ').replace(/[ \t]+/g,' ').trim();
const money=v=>{if(v===null||v===undefined||v==='')return null;const x=Number(String(v).replace(/,/g,'').replace(/[^0-9.-]/g,''));return Number.isFinite(x)?x:null;};
const ccy=v=>{v=n(v).toUpperCase();return v==='NTD'||v==='NT$'?'TWD':v;};
const acct=v=>String(v??'').replace(/\D/g,'');
const dedupe=(arr,keyfn)=>[...new Map(arr.map(x=>[keyfn(x),x])).values()];
function show(msg,bad=false){$('status').textContent=msg;$('status').className='status'+(bad?' bad':'');$('status').style.display='block';}
function setFiles(fs){S.files=fs.filter(f=>f.name.toLowerCase().endsWith('.pdf'));$('fileList').innerHTML=S.files.length?S.files.map(f=>'📄 '+f.name).join('<br>'):'尚未選擇檔案';}
const drop=$('drop'),pdfs=$('pdfs');drop.addEventListener('click',()=>pdfs.click());pdfs.addEventListener('change',e=>setFiles([...e.target.files]));['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('drag');}));['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('drag');}));drop.addEventListener('drop',e=>setFiles([...e.dataTransfer.files]));
async function readPdf(file){const data=await file.arrayBuffer();const doc=await pdfjsLib.getDocument({data}).promise;let all=[];for(let p=1;p<=doc.numPages;p++){const page=await doc.getPage(p);const tc=await page.getTextContent();const items=tc.items.map(it=>({s:n(it.str),x:it.transform[4],y:it.transform[5]})).filter(it=>it.s);items.sort((a,b)=>Math.abs(b.y-a.y)>2?b.y-a.y:a.x-b.x);const lines=[];for(const it of items){let line=lines.find(l=>Math.abs(l.y-it.y)<2);if(!line){line={y:it.y,a:[]};lines.push(line);}line.a.push(it);}lines.sort((a,b)=>b.y-a.y);all.push(...lines.map(l=>l.a.sort((a,b)=>a.x-b.x).map(x=>x.s).join(' ')));}return{pages:doc.numPages,lines:all,text:all.join('\n')};}
function pick(text,res){for(const re of res){const m=text.match(re);if(m)return n(m[1]);}return '';}
function detectBank(text){if(text.includes('兆豐'))return'兆豐國際商業銀行';if(text.includes('台北富邦')||text.includes('北富銀'))return'台北富邦商業銀行';if(text.includes('臺灣中小企業')||text.includes('台灣中小企業')||text.includes('臺企')||text.includes('台企'))return'臺灣中小企業銀行';return pick(text,[/金融機構名稱\s*[:：]?\s*([^\n]+)/]);}
function parseMeta(text,file){return{file,company:pick(text,[/查核企業名稱\s*[:：]?\s*([^\n]+)/,/受查者名稱\s*[:：]?\s*([^\n]+)/]),id:pick(text,[/查核企業統一編號\s*[:：]?\s*(\d{8})/,/統一編號\s*[:：]?\s*(\d{8})/]),date:pick(text,[/查核基準日\s*[:：]?\s*(\d{4}\/\d{2}\/\d{2})/]),bank:detectBank(text),branch:pick(text,[/分支機構名稱\s*[:：]?\s*([^\n]+)/]),caseNo:pick(text,[/(?:案件申請編號|詢證函案件編號)\s*[:：]?\s*([0-9-]+)/])};}
function sliceSection(lines,start,end){const s=lines.findIndex(x=>x.includes(start));if(s<0)return[];const e=lines.findIndex((x,i)=>i>s&&x.includes(end));return lines.slice(s,e>s?e:lines.length);}
function parseDepositLine(line,meta){let type='';for(const t of ['活期存款','支票存款','定期存款','外幣存款','其他存款'])if(line.includes(t)){type=t;break;}if(!type)return null;const cur=line.match(/\b(TWD|NTD|USD|EUR|JPY|CNY|RMB|HKD|GBP|AUD|CAD|SGD)\b/i);if(!cur)return null;const accs=line.match(/\b\d{8,18}\b/g)||[];if(!accs.length)return null;const p=line.toUpperCase().indexOf(cur[1].toUpperCase());const vals=(line.slice(p+cur[1].length).match(/-?[0-9][0-9,]*(?:\.\d+)?/g)||[]).map(money).filter(v=>v!==null);if(!vals.length)return null;return{bank:meta.bank,branch:meta.branch,type,account:acct(accs[0]),currency:ccy(cur[1]),balance:vals[0],rate:vals.length>1&&Math.abs(vals[1])<1?vals[1]:null,baseDate:meta.date,file:meta.file};}
function parseDeposits(lines,meta){return dedupe(sliceSection(lines,'1.存款','2.貼現及放款').map(l=>parseDepositLine(l,meta)).filter(Boolean),x=>[x.file,x.account,x.currency,x.type,x.balance].join('|'));}
function parseLoanLine(line,meta){let type='';for(const t of ['短期放款','中長期放款','透支','貼現','墊付國內票款'])if(line.includes(t)){type=t;break;}if(!type)return null;const cur=line.match(/\b(TWD|NTD|USD|EUR|JPY|CNY|RMB|HKD|GBP|AUD|CAD|SGD)\b/i);if(!cur)return null;const accs=line.match(/\b\d{8,18}\b/g)||[];if(!accs.length)return null;const p=line.toUpperCase().indexOf(cur[1].toUpperCase());const vals=(line.slice(p+cur[1].length).match(/-?[0-9][0-9,]*(?:\.\d+)?/g)||[]).map(money).filter(v=>v!==null);if(!vals.length)return null;const dates=line.match(/\d{4}\/\d{2}\/\d{2}/g)||[];const rates=(line.match(/0\.\d{4,}/g)||[]).map(Number);return{bank:meta.bank,branch:meta.branch,type,account:acct(accs[0]),currency:ccy(cur[1]),balance:vals[0],loanDate:dates[0]||'',maturity:dates[1]||'',rate:rates[0]??null,baseDate:meta.date,file:meta.file};}
function parseLoans(lines,meta){return dedupe(sliceSection(lines,'2.貼現及放款','3.應收帳款承購').map(l=>parseLoanLine(l,meta)).filter(Boolean),x=>[x.file,x.account,x.currency,x.type,x.balance].join('|'));}
async function run(){if(!S.files.length){show('請先上傳 PDF',true);return;}$('runBtn').disabled=true;S.dep=[];S.loan=[];S.meta=[];S.diag=[];show('解析中…');for(const f of S.files){try{const d=await readPdf(f);const m=parseMeta(d.text,f.name);const dep=parseDeposits(d.lines,m);const loan=parseLoans(d.lines,m);S.meta.push(m);S.dep.push(...dep);S.loan.push(...loan);S.diag.push({file:f.name,pages:d.pages,textLines:d.lines.length,deposits:dep.length,loans:loan.length,warning:dep.length+loan.length===0?'未辨識到存款或借款，請人工複核':''});}catch(e){S.diag.push({file:f.name,pages:'',textLines:'',deposits:0,loans:0,warning:'解析失敗：'+(e&&e.message?e.message:String(e))});}}$('runBtn').disabled=false;$('dlBtn').disabled=false;$('result').style.display='block';$('k1').textContent=S.files.length;$('k2').textContent=S.dep.length;$('k3').textContent=S.loan.length;$('k4').textContent=S.diag.filter(x=>x.warning).length;show('完成：存款 '+S.dep.length+' 筆、借款 '+S.loan.length+' 筆');render();}
const cols={dep:[['bank','銀行'],['branch','分行'],['type','存款別'],['account','帳號'],['currency','幣別'],['balance','餘額'],['rate','利率'],['baseDate','基準日'],['file','來源']],loan:[['bank','銀行'],['branch','分行'],['type','放款別'],['account','帳號'],['currency','幣別'],['balance','餘額'],['loanDate','借款日'],['maturity','到期日'],['rate','利率'],['file','來源']],meta:[['file','檔案'],['company','受查公司'],['id','統編'],['date','基準日'],['bank','銀行'],['branch','分行'],['caseNo','案件編號']],diag:[['file','檔案'],['pages','頁數'],['textLines','文字行數'],['deposits','存款筆數'],['loans','借款筆數'],['warning','診斷']]};
function render(){const c=cols[S.tab],d=S[S.tab];$('thead').innerHTML='<tr>'+c.map(x=>'<th>'+x[1]+'</th>').join('')+'</tr>';$('tbody').innerHTML=d.map(r=>'<tr class="'+(r.warning?'warn':'')+'">'+c.map(x=>'<td>'+String(r[x[0]]??'')+'</td>').join('')+'</tr>').join('')||'<tr><td colspan="10">目前沒有資料</td></tr>';}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));b.classList.add('on');S.tab=b.dataset.tab;render();}));
function download(){if(!window.XLSX){show('Excel 匯出元件載入失敗，請重新整理頁面。',true);return;}const w=XLSX.utils.book_new();for(const [name,key] of [['銀行存款','dep'],['銀行借款','loan'],['函證資訊','meta'],['解析診斷','diag']]){const c=cols[key],d=S[key];const ws=XLSX.utils.aoa_to_sheet([c.map(x=>x[1]),...d.map(r=>c.map(x=>r[x[0]]??''))]);XLSX.utils.book_append_sheet(w,ws,name);}XLSX.writeFile(w,'銀行電子函證清洗結果.xlsx');}
function clearAll(){S.files=[];S.dep=[];S.loan=[];S.meta=[];S.diag=[];$('fileList').textContent='';$('result').style.display='none';$('status').style.display='none';$('dlBtn').disabled=true;pdfs.value='';}
$('runBtn').addEventListener('click',run);$('dlBtn').addEventListener('click',download);$('clearBtn').addEventListener('click',clearAll);
})();
</script>
</body>
</html>

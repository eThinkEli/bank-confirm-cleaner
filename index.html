<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>e-Think 銀行電子函證 PDF 清洗工具</title>
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{--navy:#17365d;--orange:#ed7d31;--bg:#f4f7fb;--line:#dce4ee;--text:#172033;--muted:#64748b}
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--text)}
header{background:var(--navy);color:#fff;padding:22px 0}.wrap{max-width:1180px;margin:auto;padding:0 18px}.brand{font-size:25px;font-weight:800}.sub{opacity:.8;margin-top:5px}.privacy{float:right;font-size:12px;opacity:.85}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;box-shadow:0 8px 24px #17365d12;margin-top:24px}.drop{border:2px dashed #aab8c8;border-radius:12px;padding:38px 20px;text-align:center;cursor:pointer;transition:.15s}.drop.drag,.drop:hover{border-color:var(--orange);background:#fff9f5}.drop strong{font-size:18px}.hint{color:var(--muted);font-size:13px;margin-top:8px}.files{margin-top:14px;font-size:13px;line-height:1.7}.fileok{color:#166534}.actions{display:flex;gap:10px;justify-content:flex-end;margin:18px 0}.btn{border:0;border-radius:9px;padding:11px 16px;font-weight:700;cursor:pointer}.btn:disabled{opacity:.45;cursor:not-allowed}.orange{background:var(--orange);color:#fff}.navy{background:var(--navy);color:#fff}.gray{background:#e8edf3;color:var(--navy)}
.status{padding:12px 14px;border-radius:9px;background:#e8f6ed;margin-bottom:16px;display:none}.status.bad{background:#fdecec;color:#991b1b}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:15px}.kpi b{font-size:24px;color:var(--navy)}
.tabs{display:flex;gap:6px;margin:14px 0;flex-wrap:wrap}.tab{padding:8px 12px;border:1px solid #ccd5df;background:#fff;border-radius:8px;cursor:pointer}.tab.on{background:var(--navy);color:#fff}.table{max-height:560px;overflow:auto;border-radius:12px;border:1px solid var(--line)}table{width:100%;border-collapse:collapse;background:#fff;font-size:12px}th{background:var(--navy);color:#fff;padding:9px;text-align:left;position:sticky;top:0;white-space:nowrap}td{padding:8px;border-bottom:1px solid #edf1f5;vertical-align:top}.warn{background:#fff8e8}.mono{font-family:Consolas,monospace}.footer{color:var(--muted);font-size:12px;padding:18px 0 30px}
@media(max-width:800px){.kpis{grid-template-columns:1fr 1fr}.privacy{float:none;display:block;margin-top:8px}}
</style>
</head>
<body>
<header><div class="wrap"><span class="brand">e-Think｜銀行電子函證 PDF 清洗工具</span><span class="privacy">🔒 PDF 僅在瀏覽器本機解析，不上傳伺服器</span><div class="sub">Bank Confirmation PDF Cleaner</div></div></header>
<main class="wrap">
<div class="card">
<h3>上傳銀行電子函證 PDF</h3>
<div id="drop" class="drop">
<strong>拖曳 PDF 到這裡，或點擊選擇檔案</strong>
<div class="hint">可一次上傳多家銀行電子函證；目前針對金融區塊鏈標準函證格式解析</div>
<input id="pdfs" type="file" accept="application/pdf,.pdf" multiple hidden />
</div>
<div id="fileList" class="files"></div>
</div>
<div class="actions"><button class="btn gray" onclick="resetAll()">清除全部</button><button class="btn orange" id="runBtn" onclick="runParse()">開始清洗</button><button class="btn navy" id="dlBtn" onclick="downloadExcel()" disabled>下載清洗 Excel</button></div>
<div id="status" class="status"></div>
<section id="result" style="display:none">
<div class="kpis"><div class="kpi">PDF 檔案<br><b id="k1">0</b></div><div class="kpi">存款筆數<br><b id="k2">0</b></div><div class="kpi">借款筆數<br><b id="k3">0</b></div><div class="kpi">需複核<br><b id="k4">0</b></div></div>
<div class="tabs"><button class="tab on" data-tab="dep">銀行存款</button><button class="tab" data-tab="loan">銀行借款</button><button class="tab" data-tab="other">其他項目</button><button class="tab" data-tab="meta">函證資訊</button><button class="tab" data-tab="diag">解析診斷</button></div>
<div class="table"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div>
</section>
<div class="footer">此工具只做函證 PDF 讀取、清洗與彙整，不會修改 A／AA 底稿。</div>
</main>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
const S={files:[],dep:[],loan:[],other:[],meta:[],diag:[],tab:'dep'};
const n=v=>String(v??'').replace(/\u00a0/g,' ').replace(/[ \t]+/g,' ').trim();
const money=v=>{if(v==null)return null;const x=Number(String(v).replace(/,/g,'').replace(/[^0-9.-]/g,''));return Number.isFinite(x)?x:null};
const acct=v=>String(v??'').replace(/[^0-9]/g,'');
const ccy=v=>{v=n(v).toUpperCase();return v==='NTD'||v==='NT$'?'TWD':v};
const bankAlias=t=>{const m=[['兆豐','兆豐國際商業銀行'],['台北富邦','台北富邦商業銀行'],['北富銀','台北富邦商業銀行'],['臺灣中小企業','臺灣中小企業銀行'],['台灣中小企業','臺灣中小企業銀行'],['臺企','臺灣中小企業銀行'],['台企','臺灣中小企業銀行']];for(const [k,v] of m)if(t.includes(k))return v;return ''};
const drop=document.getElementById('drop'),pdfs=document.getElementById('pdfs');drop.onclick=()=>pdfs.click();pdfs.onchange=e=>setFiles([...e.target.files]);['dragenter','dragover'].forEach(x=>drop.addEventListener(x,e=>{e.preventDefault();drop.classList.add('drag')}));['dragleave','drop'].forEach(x=>drop.addEventListener(x,e=>{e.preventDefault();drop.classList.remove('drag')}));drop.addEventListener('drop',e=>setFiles([...e.dataTransfer.files].filter(f=>f.type==='application/pdf'||f.name.toLowerCase().endsWith('.pdf'))));
function setFiles(fs){S.files=fs;fileList.innerHTML=fs.length?fs.map(f=>`<div>📄 ${f.name} <span class="fileok">已選取</span></div>`).join(''):'尚未選擇檔案'}
async function readPdf(file){const doc=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;let pages=[],all=[];for(let p=1;p<=doc.numPages;p++){const pg=await doc.getPage(p),ct=await pg.getTextContent();const items=ct.items.map(x=>({s:n(x.str),x:x.transform[4],y:x.transform[5]})).filter(x=>x.s);items.sort((a,b)=>Math.abs(b.y-a.y)>2?b.y-a.y:a.x-b.x);let lines=[];for(const it of items){let line=lines.find(l=>Math.abs(l.y-it.y)<2);if(!line){line={y:it.y,a:[]};lines.push(line)}line.a.push(it)}lines.sort((a,b)=>b.y-a.y);const txt=lines.map(l=>l.a.sort((a,b)=>a.x-b.x).map(x=>x.s).join(' '));pages.push(txt);all.push(...txt)}return {pages,lines:all,text:all.join('\n')}}
function pick(text,patterns){for(const re of patterns){const m=text.match(re);if(m)return n(m[1])}return ''}
function parseMeta(text,file){const company=pick(text,[/查核企業名稱\s*[:：]?\s*([^\n]+)/,/受查者名稱\s*[:：]?\s*([^\n]+)/]);const id=pick(text,[/查核企業統一編號\s*[:：]?\s*(\d{8})/,/統一編號\s*[:：]?\s*(\d{8})/]);const date=pick(text,[/查核基準日\s*[:：]?\s*(\d{4}\/\d{2}\/\d{2})/]);const caseNo=pick(text,[/(?:案件申請編號|詢證函案件編號)\s*[:：]?\s*([0-9-]+)/]);let bank=bankAlias(text);if(!bank)bank=pick(text,[/金融機構名稱\s*[:：]?\s*([^\n]+)/]);let branch=pick(text,[/分支機構名稱\s*[:：]?\s*([^\n]+)/]);return {file,company,id,date,bank,branch,caseNo}}
function sectionLines(lines,start,end){let s=lines.findIndex(x=>x.includes(start));if(s<0)return[];let e=end?lines.findIndex((x,i)=>i>s&&x.includes(end)):-1;return lines.slice(s,e>0?e:lines.length)}
function parseDeposits(lines,meta){const sec=sectionLines(lines,'1.存款','2.貼現及放款');let out=[];for(const line of sec){const cur=line.match(/\b(TWD|NTD|USD|EUR|JPY|CNY|RMB|HKD|GBP|AUD|CAD|SGD)\b/i);if(!cur)continue;const nums=line.match(/\b\d{6,16}\b/g)||[];if(!nums.length)continue;let type='';for(const t of ['活期存款','支票存款','定期存款','外幣存款','其他存款'])if(line.includes(t)){type=t;break}const a=nums.find(x=>x.length>=8)||nums[0];const after=line.slice(line.toUpperCase().indexOf(cur[1].toUpperCase())+cur[1].length);const vals=(after.match(/-?[0-9][0-9,]*(?:\.\d+)?/g)||[]).map(money).filter(x=>x!==null);if(!type||!a||!vals.length)continue;const rate=vals.length>1&&Math.abs(vals[1])<1?vals[1]:null;out.push({bank:meta.bank,branch:meta.branch,type,account:acct(a),currency:ccy(cur[1]),balance:vals[0],rate,baseDate:meta.date,file:meta.file,review:''})}return dedupe(out,x=>[x.file,x.account,x.currency,x.type,x.balance].join('|'))}
function parseLoans(lines,meta){const sec=sectionLines(lines,'2.貼現及放款','3.應收帳款承購');let out=[];for(const line of sec){let type='';for(const t of ['短期放款','中長期放款','透支','貼現','墊付國內票款'])if(line.includes(t)){type=t;break}if(!type)continue;const cur=line.match(/\b(TWD|NTD|USD|EUR|JPY|CNY|RMB|HKD|GBP|AUD|CAD|SGD)\b/i);const nums=line.match(/\b\d{6,18}\b/g)||[];if(!cur||!nums.length)continue;const a=nums.find(x=>x.length>=8)||nums[0];const after=line.slice(line.toUpperCase().indexOf(cur[1].toUpperCase())+cur[1].length);const vals=(after.match(/-?[0-9][0-9,]*(?:\.\d+)?/g)||[]).map(money).filter(x=>x!==null);if(!vals.length)continue;const dates=line.match(/\d{4}\/\d{2}\/\d{2}/g)||[];const rates=(line.match(/0\.\d{4,}/g)||[]).map(Number);out.push({bank:meta.bank,branch:meta.branch,type,account:acct(a),currency:ccy(cur[1]),balance:vals[0],loanDate:dates[0]||'',maturity:dates[1]||'',rate:rates[0]??null,collateral:line.includes('土地')||line.includes('建物')?'土地建物':line.includes('有')?'有':'',baseDate:meta.date,file:meta.file,review:''})}return dedupe(out,x=>[x.file,x.account,x.currency,x.type,x.balance].join('|'))}
function parseOther(lines,meta){const keys=['應收帳款承購','信用狀','承兌','保證','衍生工具','黃金存摺','已註銷帳戶','代收票據','信託','有價證券'];let out=[];for(const line of lines){for(const k of keys){if(line.includes(k)&&!/^\d+[.．、]?/.test(line.trim())){const zero=/無|none/i.test(line);out.push({bank:meta.bank,item:k,summary:line,status:zero?'無':'請複核',file:meta.file});break}}}return dedupe(out,x=>[x.file,x.item,x.summary].join('|'))}
function dedupe(arr,keyfn){const m=new Map;for(const x of arr)m.set(keyfn(x),x);return [...m.values()]}
async function runParse(){if(!S.files.length){show('請先上傳 PDF',true);return}runBtn.disabled=true;S.dep=[];S.loan=[];S.other=[];S.meta=[];S.diag=[];show('解析中…');for(const f of S.files){try{const d=await readPdf(f),m=parseMeta(d.text,f.name),dep=parseDeposits(d.lines,m),loan=parseLoans(d.lines,m),other=parseOther(d.lines,m);S.meta.push(m);S.dep.push(...dep);S.loan.push(...loan);S.other.push(...other);S.diag.push({file:f.name,pages:d.pages.length,textLines:d.lines.length,deposits:dep.length,loans:loan.length,warning:dep.length+loan.length===0?'未辨識到存款或借款，請人工複核':''})}catch(e){S.diag.push({file:f.name,pages:'',textLines:'',deposits:0,loans:0,warning:'解析失敗：'+e.message})}}k1.textContent=S.files.length;k2.textContent=S.dep.length;k3.textContent=S.loan.length;k4.textContent=S.diag.filter(x=>x.warning).length+S.other.filter(x=>x.status==='請複核').length;result.style.display='block';dlBtn.disabled=false;runBtn.disabled=false;show(`完成：存款 ${S.dep.length} 筆、借款 ${S.loan.length} 筆。未自動寫入任何底稿。`);render()}
function show(t,bad=false){status.style.display='block';status.textContent=t;status.className='status'+(bad?' bad':'')}
const COLS={dep:[['bank','銀行'],['branch','分行'],['type','存款別'],['account','帳號'],['currency','幣別'],['balance','函證餘額'],['rate','利率'],['baseDate','基準日'],['file','PDF']],loan:[['bank','銀行'],['branch','分行'],['type','放款別'],['account','帳號'],['currency','幣別'],['balance','函證餘額'],['loanDate','借款日'],['maturity','到期日'],['rate','利率'],['collateral','擔保'],['baseDate','基準日'],['file','PDF']],other:[['bank','銀行'],['item','項目'],['summary','PDF 摘要文字'],['status','狀態'],['file','PDF']],meta:[['file','PDF'],['company','受查公司'],['id','統編'],['date','基準日'],['bank','銀行'],['branch','分行'],['caseNo','案件編號']],diag:[['file','PDF'],['pages','頁數'],['textLines','文字行數'],['deposits','存款筆數'],['loans','借款筆數'],['warning','診斷']]};
function render(){const c=COLS[S.tab],d=S[S.tab];thead.innerHTML='<tr>'+c.map(x=>`<th>${x[1]}</th>`).join('')+'</tr>';tbody.innerHTML=d.length?d.map(r=>'<tr class="'+(r.warning||r.status==='請複核'?'warn':'')+'">'+c.map(x=>`<td${x[0]==='account'?' class="mono"':''}>${r[x[0]]??''}</td>`).join('')+'</tr>').join(''):`<tr><td colspan="${c.length}">目前沒有資料</td></tr>`}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));b.classList.add('on');S.tab=b.dataset.tab;render()});
function downloadExcel(){const w=XLSX.utils.book_new();for(const [sheet,key] of [['銀行存款明細','dep'],['銀行借款明細','loan'],['其他項目','other'],['函證資訊','meta'],['解析診斷','diag']]){const c=COLS[key],d=S[key],aoa=[c.map(x=>x[1]),...d.map(r=>c.map(x=>r[x[0]]??''))];const ws=XLSX.utils.aoa_to_sheet(aoa);ws['!cols']=c.map(x=>({wch:Math.max(12,Math.min(32,x[1].length*2+8))}));XLSX.utils.book_append_sheet(w,ws,sheet)}XLSX.writeFile(w,'銀行電子函證_PDF清洗結果_'+new Date().toISOString().slice(0,10)+'.xlsx')}
function resetAll(){S.files=[];S.dep=[];S.loan=[];S.other=[];S.meta=[];S.diag=[];fileList.innerHTML='';result.style.display='none';status.style.display='none';dlBtn.disabled=true;pdfs.value=''}
</script>
</body></html>

<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>e-Think 銀行電子函證 PDF 清洗工具</title><script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><style>:root{--n:#17365d;--o:#ed7d31;--b:#f4f7fb;--l:#dce4ee;--t:#172033;--m:#64748b}*{box-sizing:border-box}body{margin:0;font-family:Arial,"Microsoft JhengHei",sans-serif;background:var(--b);color:var(--t)}header{background:var(--n);color:white;padding:22px}.wrap{max-width:1180px;margin:auto}.brand{font-size:24px;font-weight:800}.privacy{float:right;font-size:12px;opacity:.85}.card{background:white;border:1px solid var(--l);border-radius:14px;padding:22px;margin-top:24px}.drop{border:2px dashed #aab8c8;border-radius:12px;padding:38px 20px;text-align:center;cursor:pointer}.drop:hover,.drop.drag{border-color:var(--o);background:#fff9f5}.hint,.files,.footer{font-size:13px;color:var(--m)}.actions{display:flex;gap:10px;justify-content:flex-end;margin:18px 0}.btn{border:0;border-radius:9px;padding:11px 16px;font-weight:700;cursor:pointer}.btn:disabled{opacity:.45}.orange{background:var(--o);color:white}.navy{background:var(--n);color:white}.gray{background:#e8edf3;color:var(--n)}.status{display:none;padding:12px 14px;border-radius:9px;background:#e8f6ed;margin-bottom:16px}.status.bad{background:#fdecec;color:#991b1b}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}.kpi{background:white;border:1px solid var(--l);border-radius:12px;padding:15px}.kpi b{font-size:24px;color:var(--n)}.tabs{display:flex;gap:6px;margin:14px 0;flex-wrap:wrap}.tab{padding:8px 12px;border:1px solid #ccd5df;background:white;border-radius:8px;cursor:pointer}.tab.on{background:var(--n);color:white}.table{max-height:560px;overflow:auto;border:1px solid var(--l);border-radius:12px}table{width:100%;border-collapse:collapse;background:white;font-size:12px}th{background:var(--n);color:white;padding:9px;text-align:left;position:sticky;top:0}td{padding:8px;border-bottom:1px solid #edf1f5}.warn{background:#fff8e8}.footer{padding:18px 0 30px}@media(max-width:800px){.kpis{grid-template-columns:1fr 1fr}.privacy{float:none;display:block;margin-top:8px}}</style></head><body><header><div class="wrap"><span class="brand">e-Think｜銀行電子函證 PDF 清洗工具</span><span class="privacy">🔒 PDF 僅在瀏覽器本機解析</span></div></header><main class="wrap"><div class="card"><h3>上傳銀行電子函證 PDF</h3><div id="drop" class="drop"><strong>拖曳 PDF 到這裡，或點擊選擇檔案</strong><div class="hint">可一次上傳多份金融區塊鏈電子函證 PDF</div><input id="pdfs" type="file" accept="application/pdf,.pdf" multiple hidden></div><div id="fileList" class="files" style="margin-top:12px"></div></div><div class="actions"><button class="btn gray" id="clearBtn">清除全部</button><button class="btn orange" id="runBtn">開始清洗</button><button class="btn navy" id="dlBtn" disabled>下載 Excel</button></div><div id="status" class="status"></div><section id="result" style="display:none"><div class="kpis"><div class="kpi">PDF 檔案<br><b id="k1">0</b></div><div class="kpi">存款筆數<br><b id="k2">0</b></div><div class="kpi">借款筆數<br><b id="k3">0</b></div><div class="kpi">需複核<br><b id="k4">0</b></div></div><div class="tabs"><button class="tab on" data-tab="dep">銀行存款</button><button class="tab" data-tab="loan">銀行借款</button><button class="tab" data-tab="meta">函證資訊</button><button class="tab" data-tab="diag">解析診斷</button></div><div class="table"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div></section><div class="footer">本工具只讀取與彙整 PDF，不會修改任何 A／AA 底稿。</div></main><script>(function(){'use strict';if(!window.pdfjsLib){alert('PDF 解析元件載入失敗，請重新整理頁面。');return}pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';const S={files:[],dep:[],loan:[],meta:[],diag:[],tab:'dep'};const $=id=>document.getElementById(id);const n=v=>String(v??'').replace(/\u00a0/g,' ').replace(/[ \t]+/g,' ').trim();const money=v=>{if(v===null||v===undefined||v==='')return null;const x=Number(String(v).replace(/,/g,'').replace(/[^0-9.-]/g,''));return Number.isFinite(x)?x:null};const ccy=v=>{v=n(v).toUpperCase();return v==='NTD'||v==='NT$'?'TWD':v};const acct=v=>String(v??'').replace(/\D/g,'');const dedupe=(a,k)=>[...new Map(a.map(x=>[k(x),x])).values()];function show(msg,bad=false){$('status').textContent=msg;$('status').className='status'+(bad?' bad':'');$('status').style.display='block'}function setFiles(fs){S.files=fs.filter(f=>f.name.toLowerCase().endsWith('.pdf'));$('fileList').innerHTML=S.files.length?S.files.map(f=>'📄 '+f.name).join('<br>'):'尚未選擇檔案'}const drop=$('drop'),pdfs=$('pdfs');drop.onclick=()=>pdfs.click();pdfs.onchange=e=>setFiles([...e.target.files]);['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('drag')}));['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('drag')}));drop.addEventListener('drop',e=>setFiles([...e.dataTransfer.files]));async function readPdf(file){const doc=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;let all=[];for(let p=1;p<=doc.numPages;p++){const page=await doc.getPage(p);const tc=await page.getTextContent();const items=tc.items.map(it=>({s:n(it.str),x:it.transform[4],y:it.transform[5]})).filter(it=>it.s);items.sort((a,b)=>Math.abs(b.y-a.y)>2?b.y-a.y:a.x-b.x);const lines=[];for(const it of items){let line=lines.find(l=>Math.abs(l.y-it.y)<2);if(!line){line={y:it.y,a:[]};lines.push(line)}line.a.push(it)}lines.sort((a,b)=>b.y-a.y);all.push(...lines.map(l=>l.a.sort((a,b)=>a.x-b.x).map(x=>x.s).join(' ')))}return{pages:doc.numPages,lines:all,text:all.join('\n')}}function compactText(text){return String(text||'').replace(/\s+/g,' ').replace(/活期\s*存款/g,'活期存款').replace(/支票\s*存款/g,'支票存款').replace(/定期\s*存款/g,'定期存款').replace(/短期\s*放\s*款/g,'短期放款').replace(/中長期\s*放\s*款/g,'中長期放款').replace(/中期\s*擔\s*保\s*放\s*款/g,'中期擔保放款').replace(/墊付國\s*內票款/g,'墊付國內票款').replace(/分支機構名\s*稱/g,'分支機構名稱').replace(/金融機構名\s*稱/g,'金融機構名稱').replace(/查核基準\s*日/g,'查核基準日')}function detectBank(t){const a=[['華南','華南商業銀行'],['新光','臺灣新光商業銀行'],['彰化商業銀行','彰化商業銀行'],['彰銀','彰化商業銀行'],['臺灣土地銀行','臺灣土地銀行'],['土地銀行','臺灣土地銀行'],['土銀','臺灣土地銀行'],['中國信託','中國信託商業銀行'],['中信','中國信託商業銀行'],['元大','元大商業銀行'],['台中銀行','台中銀行'],['台中銀','台中銀行'],['兆豐','兆豐國際商業銀行'],['台北富邦','台北富邦商業銀行'],['北富銀','台北富邦商業銀行'],['臺灣中小企業','臺灣中小企業銀行'],['台灣中小企業','臺灣中小企業銀行'],['臺企','臺灣中小企業銀行'],['台企','臺灣中小企業銀行']];for(const [k,v] of a)if(t.includes(k))return v;return''}function parseMeta(text,file){const t=compactText(text);const m=(re)=>{const x=t.match(re);return x?x[1]:''};let bank=detectBank(t);let branch=m(/分支機構名稱\s*([^\s]+(?:總行|分行|彰化|鹿港|福興)?)/);if(!branch)branch=file.replace(/\.pdf$/i,'').split('-').slice(1).join('-');return{file,company:m(/查核企業名稱\s*([^\s]+(?:股份有限公司|有限公司|公司))/),id:m(/查核企業統編\s*(\d{8})/),date:m(/查核基準日\s*(\d{4}\/\d{2}\/\d{2})/),bank,branch,caseNo:m(/(?:案件申請編號|詢證函案件編號)\s*([0-9-]+)/)}}function sectionText(text,start,end){const t=compactText(text);const s=t.indexOf(start);if(s<0)return'';const e=end?t.indexOf(end,s+start.length):-1;return t.slice(s,e>s?e:t.length)}function parseDeposits(text,meta){const sec=sectionText(text,'1.存款','2.貼現及放款'),out=[];const re=/(活期存款|支票存款|定期存款|外幣存款)\s*(\d{6,20})\s*(TWD|NTD|USD|EUR|JPY|CNY|RMB|HKD|GBP|AUD|CAD|SGD)\s*(-?[0-9][0-9,]*(?:\.\d+)?)/gi;let m;while((m=re.exec(sec))){const tail=sec.slice(re.lastIndex,Math.min(sec.length,re.lastIndex+100));const nums=(tail.match(/\b\d+\.\d{3,6}\b/g)||[]).map(Number);out.push({bank:meta.bank,branch:meta.branch,type:m[1],account:acct(m[2]),currency:ccy(m[3]),balance:money(m[4]),rate:nums.length?nums[nums.length-1]:null,baseDate:meta.date,file:meta.file})}return dedupe(out,x=>[x.file,x.account,x.currency,x.type,x.balance].join('|'))}function parseLoans(text,meta){const sec=sectionText(text,'2.貼現及放款','3.應收帳款承購'),out=[];const re=/(中期擔保放款|中長期放款|短期放款|透支|貼現|墊付國內票款)\s*(\d{8,22})\s*(TWD|NTD|USD|EUR|JPY|CNY|RMB|HKD|GBP|AUD|CAD|SGD)\s*(-?[0-9][0-9,]*(?:\.\d+)?)/gi;let m;while((m=re.exec(sec))){const rest=sec.slice(re.lastIndex);const next=rest.search(/(?:中期擔保放款|中長期放款|短期放款|透支|貼現|墊付國內票款)/);const tail=rest.slice(0,next>=0?next:Math.min(rest.length,320));const dates=tail.match(/\d{4}\/\d{2}\/\d{2}/g)||[];let rate=null;if(dates.length>=2){const p=tail.indexOf(dates[1])+dates[1].length,rm=tail.slice(p).match(/\b\d{1,3}\.\d{2,6}\b/);rate=rm?Number(rm[0]):null}else{const rm=tail.match(/\b\d{1,3}\.\d{2,6}\b/);rate=rm?Number(rm[0]):null}const collateral=/土地|建物/.test(tail)?'土地建物':(/\s有\s+有\s/.test(' '+tail+' ')?'有':'');out.push({bank:meta.bank,branch:meta.branch,type:m[1],account:acct(m[2]),currency:ccy(m[3]),balance:money(m[4]),loanDate:dates[0]||'',maturity:dates[1]||'',rate,collateral,baseDate:meta.date,file:meta.file})}return dedupe(out,x=>[x.file,x.account,x.currency,x.type,x.balance].join('|'))}async function run(){if(!S.files.length){show('請先上傳 PDF',true);return}$('runBtn').disabled=true;S.dep=[];S.loan=[];S.meta=[];S.diag=[];show('解析中…');for(const f of S.files){try{const d=await readPdf(f),m=parseMeta(d.text,f.name),dep=parseDeposits(d.text,m),loan=parseLoans(d.text,m);S.meta.push(m);S.dep.push(...dep);S.loan.push(...loan);S.diag.push({file:f.name,pages:d.pages,textLines:d.lines.length,deposits:dep.length,loans:loan.length,warning:dep.length+loan.length===0?'未辨識到存款或借款，請人工複核':''})}catch(e){S.diag.push({file:f.name,pages:'',textLines:'',deposits:0,loans:0,warning:'解析失敗：'+(e?.message||e)})}}$('runBtn').disabled=false;$('dlBtn').disabled=false;$('result').style.display='block';$('k1').textContent=S.files.length;$('k2').textContent=S.dep.length;$('k3').textContent=S.loan.length;$('k4').textContent=S.diag.filter(x=>x.warning).length;show('完成：存款 '+S.dep.length+' 筆、借款 '+S.loan.length+' 筆');render()}const cols={dep:[['bank','銀行'],['branch','分行'],['type','存款別'],['account','帳號'],['currency','幣別'],['balance','餘額'],['rate','利率'],['baseDate','基準日'],['file','來源']],loan:[['bank','銀行'],['branch','分行'],['type','放款別'],['account','帳號'],['currency','幣別'],['balance','餘額'],['loanDate','借款日'],['maturity','到期日'],['rate','利率'],['collateral','擔保品'],['file','來源']],meta:[['file','檔案'],['company','受查公司'],['id','統編'],['date','基準日'],['bank','銀行'],['branch','分行'],['caseNo','案件編號']],diag:[['file','檔案'],['pages','頁數'],['textLines','文字行數'],['deposits','存款筆數'],['loans','借款筆數'],['warning','診斷']]};function render(){const c=cols[S.tab],d=S[S.tab];$('thead').innerHTML='<tr>'+c.map(x=>'<th>'+x[1]+'</th>').join('')+'</tr>';$('tbody').innerHTML=d.map(r=>'<tr class="'+(r.warning?'warn':'')+'">'+c.map(x=>'<td>'+String(r[x[0]]??'')+'</td>').join('')+'</tr>').join('')||'<tr><td colspan="12">目前沒有資料</td></tr>'}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));b.classList.add('on');S.tab=b.dataset.tab;render()});function download(){if(!window.XLSX){show('Excel 匯出元件載入失敗',true);return}const w=XLSX.utils.book_new();for(const [name,key] of [['銀行存款','dep'],['銀行借款','loan'],['函證資訊','meta'],['解析診斷','diag']]){const c=cols[key],d=S[key],ws=XLSX.utils.aoa_to_sheet([c.map(x=>x[1]),...d.map(r=>c.map(x=>r[x[0]]??''))]);XLSX.utils.book_append_sheet(w,ws,name)}XLSX.writeFile(w,'銀行電子函證清洗結果.xlsx')}function clearAll(){S.files=[];S.dep=[];S.loan=[];S.meta=[];S.diag=[];$('fileList').textContent='';$('result').style.display='none';$('status').style.display='none';$('dlBtn').disabled=true;pdfs.value=''}$('runBtn').onclick=run;$('dlBtn').onclick=download;$('clearBtn').onclick=clearAll})();</script></body></html>

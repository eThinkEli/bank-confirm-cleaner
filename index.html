<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>e-Think 銀行電子函證清洗工具</title><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><style>body{margin:0;font-family:Arial,'Microsoft JhengHei',sans-serif;background:#f4f7fb;color:#172033}header{background:#17365d;color:#fff;padding:22px}.wrap{max-width:1180px;margin:auto;padding:0 18px}.brand{font-size:25px;font-weight:800}.sub{opacity:.8;margin-top:5px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:24px}.card{background:#fff;border:1px solid #dce4ee;border-radius:14px;padding:20px;box-shadow:0 8px 24px #17365d12}.drop{border:2px dashed #aab8c8;border-radius:12px;padding:28px;text-align:center;cursor:pointer}.drop:hover{border-color:#ed7d31;background:#fff9f5}.files{font-size:12px;color:#64748b;margin-top:12px}.actions{display:flex;gap:10px;justify-content:flex-end;margin:18px 0}.btn{border:0;border-radius:9px;padding:10px 15px;font-weight:700;cursor:pointer}.orange{background:#ed7d31;color:#fff}.navy{background:#17365d;color:#fff}.gray{background:#e8edf3;color:#17365d}.status{padding:12px;border-radius:9px;background:#e8f6ed;margin-bottom:16px;display:none}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}.kpi{background:#fff;border:1px solid #dce4ee;border-radius:12px;padding:15px}.kpi b{font-size:24px;color:#17365d}table{width:100%;border-collapse:collapse;background:#fff;font-size:12px}th{background:#17365d;color:#fff;padding:9px;text-align:left;position:sticky;top:0}td{padding:8px;border-bottom:1px solid #edf1f5}.table{max-height:520px;overflow:auto;border-radius:12px;border:1px solid #dce4ee}.tabs{display:flex;gap:6px;margin:14px 0}.tab{padding:8px 12px;border:1px solid #ccd5df;background:#fff;border-radius:8px;cursor:pointer}.tab.on{background:#17365d;color:#fff}.warn{background:#fff4d6}.bad{background:#fdecec}.privacy{float:right;font-size:12px;opacity:.85}@media(max-width:800px){.grid,.kpis{grid-template-columns:1fr}.privacy{float:none;display:block;margin-top:8px}}</style></head><body><header><div class="wrap"><span class="brand">e-Think｜銀行電子函證清洗與比對工具</span><span class="privacy">🔒 檔案僅在瀏覽器本機處理</span><div class="sub">Bank Confirmation Cleaner</div></div></header><main class="wrap"><div class="grid"><div class="card"><h3>1. 上傳電子函證</h3><div class="drop" onclick="cf.click()">拖曳或點擊選擇 .xlsx / .xlsm<input id="cf" type="file" accept=".xlsx,.xlsm" multiple hidden></div><div id="cfl" class="files"></div></div><div class="card"><h3>2. 上傳 A / AA 底稿</h3><div class="drop" onclick="wf.click()">拖曳或點擊選擇 A、AA Excel<input id="wf" type="file" accept=".xlsx,.xlsm" multiple hidden></div><div id="wfl" class="files"></div></div></div><div class="actions"><button class="btn gray" onclick="resetAll()">清除</button><button class="btn orange" onclick="run()">開始清洗與比對</button><button id="dl" class="btn navy" onclick="download()" disabled>下載 Excel</button></div><div id="st" class="status"></div><section id="result" style="display:none"><div class="kpis"><div class="kpi">函證檔案<br><b id="k1">0</b></div><div class="kpi">存款筆數<br><b id="k2">0</b></div><div class="kpi">借款筆數<br><b id="k3">0</b></div><div class="kpi">Exception<br><b id="k4">0</b></div></div><div class="tabs"><button class="tab on" data-t="ex">Exception</button><button class="tab" data-t="dep">存款</button><button class="tab" data-t="loan">借款</button><button class="tab" data-t="book">帳載</button></div><div class="table"><table><thead id="th"></thead><tbody id="tb"></tbody></table></div></section></main><script>const S={cf:[],wf:[],dep:[],loan:[],book:[],rec:[],tab:'ex'};const n=v=>String(v??'').replace(/\s+/g,' ').trim(),acct=v=>String(v??'').replace(/\D/g,''),ccy=v=>{v=n(v).toUpperCase();return v==='NTD'||v==='NT$'?'TWD':v},num=v=>{if(v===''||v==null)return null;let x=Number(String(v).replace(/,/g,'').replace(/[^\d.-]/g,''));return isFinite(x)?x:null},key=v=>n(v).replace(/\s/g,'');function files(id,keyn){document.getElementById(id).innerHTML=S[keyn].map(x=>x.name).join('<br>')}cf.onchange=e=>{S.cf=[...e.target.files];files('cfl','cf')};wf.onchange=e=>{S.wf=[...e.target.files];files('wfl','wf')};async function wb(f){return XLSX.read(await f.arrayBuffer(),{type:'array'})}function rows(w,s){return XLSX.utils.sheet_to_json(w.Sheets[s],{header:1,defval:'',raw:true})}function ci(row,names){let a=row.map(key);for(let x of names){let i=a.findIndex(v=>v.includes(key(x)));if(i>=0)return i}return-1}function parseConfirm(r,file,sheet){let dep=[],loan=[];for(let i=0;i<r.length;i++){let row=r[i],joined=row.map(n).join('|');if(joined.includes('存款別')&&joined.includes('帳號')&&joined.includes('幣別')&&joined.includes('餘額')){let t=ci(row,['存款別']),a=ci(row,['帳號']),c=ci(row,['幣別']),b=ci(row,['餘額']),rate=ci(row,['年利率']);for(let j=i+1;j<Math.min(i+30,r.length);j++){let x=r[j];if((x||[]).map(n).join('').match(/^\d+[.．、]/))break;let aa=acct(x[a]),cc=ccy(x[c]),bb=num(x[b]),tt=n(x[t]);if(aa.length>=5&&/^[A-Z]{3}$/.test(cc)&&bb!==null)dep.push({type:tt,account:aa,currency:cc,balance:bb,rate:rate>=0?num(x[rate]):null,source:file,sheet})}}if(joined.includes('放款別')&&joined.includes('幣別')&&joined.includes('餘額')){let t=ci(row,['放款別']),a=ci(row,['貸放帳號','帳號']),c=ci(row,['幣別']),b=ci(row,['餘額']),rate=ci(row,['年利率']);for(let j=i+1;j<Math.min(i+40,r.length);j++){let x=r[j];if((x||[]).map(n).join('').match(/^\d+[.．、]/))break;let aa=acct(x[a]),cc=ccy(x[c]),bb=num(x[b]),tt=n(x[t]);if(aa.length>=5&&/^[A-Z]{3}$/.test(cc)&&bb!==null)loan.push({type:tt,account:aa,currency:cc,balance:bb,rate:rate>=0?num(x[rate]):null,source:file,sheet})}}}return{dep,loan}}function parseBook(r,file,sheet){let out=[],sec='';for(let i=0;i<r.length;i++){let j=(r[i]||[]).map(n).join(' ');if(j.includes('活期存款明細表'))sec='活期存款';if(j.includes('支票存款明細表'))sec='支票存款';if(j.includes('外幣存款明細表'))sec='外幣存款';let row=r[i];if(j.includes('帳號')&&j.includes('幣別')&&j.includes('原幣金額')){let ba=ci(row,['銀行別']),a=ci(row,['帳號']),c=ci(row,['幣別']),b=ci(row,['原幣金額']);for(let k=i+1;k<Math.min(i+35,r.length);k++){let x=r[k],aa=acct(x[a]),cc=ccy(x[c]),bb=num(x[b]);if(aa.length>=5&&/^[A-Z]{3}$/.test(cc)&&bb!==null)out.push({kind:'存款',bank:n(x[ba]),type:sec,account:aa,currency:cc,bookBalance:bb,source:file,sheet})}}}return out}async function run(){S.dep=[];S.loan=[];S.book=[];S.rec=[];for(let f of S.cf){let w=await wb(f);for(let s of w.SheetNames){let p=parseConfirm(rows(w,s),f.name,s);S.dep.push(...p.dep);S.loan.push(...p.loan)}}for(let f of S.wf){let w=await wb(f);for(let s of w.SheetNames)S.book.push(...parseBook(rows(w,s),f.name,s))}let used=new Set;for(let d of S.dep){let i=S.book.findIndex((b,k)=>!used.has(k)&&b.account===d.account&&b.currency===d.currency);if(i>=0){used.add(i);let diff=d.balance-S.book[i].bookBalance;S.rec.push({...d,bookBalance:S.book[i].bookBalance,difference:diff,status:Math.abs(diff)<.01?'一致':'金額差異'})}else S.rec.push({...d,bookBalance:null,difference:null,status:'函證有、帳載無'})}S.book.forEach((b,i)=>{if(!used.has(i))S.rec.push({...b,balance:null,difference:null,status:'帳載有、函證無'})});k1.textContent=S.cf.length;k2.textContent=S.dep.length;k3.textContent=S.loan.length;k4.textContent=S.rec.filter(x=>x.status!=='一致').length;result.style.display='block';dl.disabled=false;st.style.display='block';st.textContent=`完成：存款 ${S.dep.length} 筆、借款 ${S.loan.length} 筆、Exception ${S.rec.filter(x=>x.status!=='一致').length} 筆`;render()}const cols={ex:[['type','類別'],['account','帳號'],['currency','幣別'],['balance','函證餘額'],['bookBalance','帳載餘額'],['difference','差異'],['status','結果']],dep:[['type','存款別'],['account','帳號'],['currency','幣別'],['balance','餘額'],['rate','利率'],['source','來源']],loan:[['type','放款別'],['account','帳號'],['currency','幣別'],['balance','餘額'],['rate','利率'],['source','來源']],book:[['type','分類'],['account','帳號'],['currency','幣別'],['bookBalance','帳載餘額'],['source','來源']]};function data(){return S.tab==='ex'?S.rec.filter(x=>x.status!=='一致'):S[S.tab]}function render(){let c=cols[S.tab],d=data();th.innerHTML='<tr>'+c.map(x=>`<th>${x[1]}</th>`).join('')+'</tr>';tb.innerHTML=d.map(r=>'<tr class="'+(r.status==='金額差異'?'bad':r.status&&r.status!=='一致'?'warn':'')+'">'+c.map(x=>`<td>${r[x[0]]??''}</td>`).join('')+'</tr>').join('')||'<tr><td colspan="8">目前沒有資料</td></tr>'}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));b.classList.add('on');S.tab=b.dataset.t;render()});function download(){let w=XLSX.utils.book_new();for(let [name,d,c] of [['銀行存款',S.dep,cols.dep],['銀行借款',S.loan,cols.loan],['帳載清洗',S.book,cols.book],['Exception',S.rec.filter(x=>x.status!=='一致'),cols.ex]])XLSX.utils.book_append_sheet(w,XLSX.utils.aoa_to_sheet([c.map(x=>x[1]),...d.map(r=>c.map(x=>r[x[0]]??''))]),name);XLSX.writeFile(w,'銀行函證清洗結果.xlsx')}function resetAll(){S.cf=[];S.wf=[];S.dep=[];S.loan=[];S.book=[];S.rec=[];cfl.innerHTML='';wfl.innerHTML='';result.style.display='none';st.style.display='none';dl.disabled=true}</script></body></html>
